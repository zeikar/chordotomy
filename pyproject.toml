[project]
name = "chordotomy"
version = "0.0.0"
description = "Dissect a song's harmony: beat-aligned chords, Roman numerals, and the moves worth noticing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zeikar" }]
dependencies = [
  "librosa>=1.0",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.scripts]
chordotomy = "chordotomy.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
eval = [
  "mir_eval>=0.8",
  "pooch>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordotomy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
